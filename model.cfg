class CfgSkeletons
{
	class Default
	{
		isDiscrete=1;
		skeletonInherit="";
		skeletonBones[]={};
	};
	class CLab_Tray_Skeleton: Default
	{
		// clab_body carries the tray, the liquid and the powder; the buds hang from it, one bone each, so each can drift
		// and hide while it follows the tray
		skeletonBones[]=
		{
			"clab_body","",
			"coca_01","clab_body",
			"coca_02","clab_body",
			"coca_03","clab_body",
			"coca_04","clab_body",
			"coca_05","clab_body",
			"coca_06","clab_body",
			"coca_07","clab_body",
			"coca_08","clab_body",
			"coca_09","clab_body",
			"coca_10","clab_body",
			"coca_11","clab_body",
			"coca_12","clab_body"
		};
	};
};
